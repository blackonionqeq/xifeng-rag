project_root: .
corpus:
  # 指向你有权使用的本地 Markdown 目录；该目录不得提交到本仓库。
  source_dir: ../xifeng-rag-private-corpus/saved_articles
  excluded_article_ids: []
storage:
  data_dir: data
embedding:
  provider: sentence-transformers
  model_id: BAAI/bge-base-zh-v1.5
  model_revision: null
  model_cache_dir: null
  device: auto
  batch_size: 16
  normalize_embeddings: true
  query_instruction: "为这个句子生成表示以用于检索相关文章："
retrieval:
  bm25_candidate_k: 5
  dense_candidate_k: 5
  rrf_k: 60

query_rewrite:
  provider: ollama
  max_variants: 1
  original_weight: 1.0
  rewrite_total_weight: 0.7
  fusion_rrf_k: 60
  candidate_limit: 128
evidence_assessment:
  enabled: false
  observation_k: 5
layered:
  splitter_version: atomic-greedy-v1
  target_chars: 400
  max_chars: 600
  tail_merge_chars: 200
  parent_candidate_k: 5
  child_candidate_k: 20
  candidate_limit: 128
  neighbor_window: 1
reranker:
  provider: sentence-transformers
  model_id: BAAI/bge-reranker-v2-m3
  model_revision: null
  model_cache_dir: null
  device: auto
  batch_size: 8
  max_pair_tokens: 1024
  candidate_k: 5
context_assembly:
  max_evidence_items: 5
  max_total_chars: 50000
  include_ai_metadata: false
generator:
  provider: deepseek
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  # 运行 `uv run xifeng generator models` 核对当前账号实际可用的模型 ID。
  model: deepseek-v4-flash
  timeout_seconds: 120
  max_output_tokens: 4096
  temperature: 0.1
ollama:
  # Windows standalone 示例；按本机安装位置在 config.local.yaml 中覆盖。
  executable: tools/ollama/ollama.exe
  model_dir: models/ollama
  host: http://127.0.0.1:11434
  model: qwen3:4b-instruct-2507-q4_K_M
  context_window: 32768
  timeout_seconds: 900
  max_retries: 2
chunking:
  codex_cli:
    executable: codex
    default_model: gpt-5.6-terra
    timeout_seconds: 900
    max_retries: 1
  external_profiles: {}
  # 如需启用外部单篇重试，将上一行替换为：
  # external_profiles:
  #   deepseek:
  #     base_url: https://api.deepseek.com
  #     api_key_env: DEEPSEEK_API_KEY
  #     default_model: deepseek-v4-flash
  #     timeout_seconds: 900
  #     max_retries: 2
