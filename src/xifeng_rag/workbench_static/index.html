<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>西风项目控制台</title><link rel="stylesheet" href="/style.css"></head>
<body>
  <main class="shell">
    <header><p class="eyebrow">LOCAL WORKBENCH</p><h1>西风项目控制台</h1><p>一个入口，打开演示、语料管理和评测工作台。</p></header>
    <section><div class="section-title"><div><p class="eyebrow">PAGES</p><h2>浏览器入口</h2></div><span>按需启动 · 仅限本机</span></div><div id="services" class="cards"></div></section>
    <section><div class="section-title"><div><p class="eyebrow">COMMANDS</p><h2>常用一次性任务</h2></div><span>复制后在项目根目录运行</span></div><div id="commands" class="commands"></div></section>
    <footer><span>关闭控制台会停止由它启动的页面</span><button id="shutdown" class="link">关闭控制台</button></footer>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
