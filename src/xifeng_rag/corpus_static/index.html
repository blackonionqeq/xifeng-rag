<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>西风语料管理</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">本地语料管理</p>
      <h1>付费文章处理进度</h1>
      <p id="summary-line" class="muted">正在读取本地数据库…</p>
    </div>
    <div class="header-actions">
      <label class="scan-option" title="开启后，正文已变化的既有文章会创建或切换版本，并需要重新分块">
        <input id="include-modified" type="checkbox">
        同时导入已修改文章
      </label>
      <button id="scan-button" type="button">扫描语料更新</button>
      <button id="refresh-button" class="secondary" type="button">刷新列表</button>
      <button id="shutdown-button" class="quiet" type="button">关闭服务</button>
    </div>
  </header>

  <main>
    <section id="stats" class="stats" aria-label="语料统计"></section>
    <p id="operation-status" class="operation-status" role="status"></p>

    <section class="filters" aria-label="筛选和排序">
      <label>搜索
        <input id="search-input" type="search" placeholder="标题、文章 ID 或文章概括">
      </label>
      <label>处理状态
        <select id="status-filter"><option value="">全部状态</option></select>
      </label>
      <label>索引情况
        <select id="index-filter">
          <option value="">全部</option>
          <option value="indexed">已索引</option>
          <option value="unindexed">未索引</option>
          <option value="pending-update">有更新待处理</option>
          <option value="missing">来源缺失</option>
        </select>
      </label>
      <label>排序
        <select id="sort-select">
          <option value="captured_at">抓取时间（新到旧）</option>
          <option value="source_modified_at">文件修改时间（新到旧）</option>
          <option value="first_imported_at">首次导入时间（新到旧）</option>
          <option value="title">标题</option>
          <option value="latest_status">处理状态</option>
        </select>
      </label>
    </section>

    <div class="table-shell">
      <table>
        <thead>
          <tr>
            <th>文章</th>
            <th>时间</th>
            <th>文件修改</th>
            <th>处理状态</th>
            <th>提案</th>
            <th>索引块</th>
            <th>版本</th>
            <th>文章概括</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="article-rows"></tbody>
      </table>
    </div>
    <p id="empty-state" class="empty-state" hidden>没有符合当前筛选条件的文章。</p>
  </main>

  <template id="stat-template">
    <article class="stat-card"><strong></strong><span></span></article>
  </template>

  <dialog id="subtopic-dialog" aria-labelledby="subtopic-dialog-title">
    <div class="dialog-body">
      <p class="eyebrow">单篇完整正文外发确认</p>
      <h2 id="subtopic-dialog-title">补充细话题</h2>
      <pre id="subtopic-disclosure"></pre>
      <div class="dialog-actions">
        <button id="subtopic-cancel" class="quiet" type="button">取消</button>
        <button id="subtopic-confirm" type="button">确认并开始生成</button>
      </div>
    </div>
  </dialog>
  <script src="/static/app.js" defer></script>
</body>
</html>
