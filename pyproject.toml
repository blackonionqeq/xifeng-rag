[project]
name = "xifeng-rag"
version = "0.1.0"
description = "本地优先的长文章 RAG 研究台"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "bm25s>=0.2.14,<1",
  "jieba>=0.42.1,<1",
  "numpy>=2,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1.1,<2",
  "pyyaml>=6,<7",
  "qdrant-client>=1.15,<2",
  "sentence-transformers>=5,<6",
  "sqlalchemy>=2.0.41,<3",
  "torch>=2.13,<2.14",
  "typer>=0.16,<1",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[project.scripts]
xifeng = "xifeng_rag.cli:app"

[dependency-groups]
dev = [
  "pyright>=1.1.403",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xifeng_rag"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
